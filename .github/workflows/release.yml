name: Release npm package

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  pull_request:

permissions:
  contents: read

jobs:
  pack:
    name: Test and inspect package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          package-manager-cache: false
      - name: Match tag to package version
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          TAG: ${{ github.ref_name }}
        run: node -e 'const expected=`v${require("./package.json").version}`; if(process.env.TAG!==expected) throw new Error(`Tag ${process.env.TAG} does not match ${expected}`)'
      - run: npm ci
      - run: npm audit
      - run: npx playwright install --with-deps chromium
      # GitHub-hosted runners do not expose the kernel sandbox features required
      # by Chromium. Disable it for this isolated CI process so the integration
      # test still proves the offline bundle and font warm-up instead of silently
      # skipping. Production keeps the sandbox enabled by default.
      - name: Run tests, and refuse a silent skip of the converter test
        env:
          EXCALIDASH_DISABLE_BROWSER_SANDBOX: "1"
        run: |
          set -o pipefail
          npm test 2>&1 | tee test-output.txt
          if grep -q "^# skipped [1-9]" test-output.txt; then
            echo "::error::A test skipped on the runner. The converter test must actually run here."
            grep -n "SKIP\|# Subtest" test-output.txt | tail -20
            exit 1
          fi
      - name: Verify generated bundle is current
        run: |
          npm run build
          git diff --exit-code -- dist
      - name: Pack and reject non-runtime files
        id: package
        run: |
          npm pack --json > pack-result.json
          node -e 'const fs=require("node:fs"); const p=JSON.parse(fs.readFileSync("pack-result.json"))[0]; const files=p.files.map(f=>f.path); const bad=files.filter(f=>/^(assets|docs|test)\//.test(f)); const required=["skills/excalidash-diagramming/SKILL.md","skills/excalidash-diagramming/agents/openai.yaml"]; const missing=required.filter(f=>!files.includes(f)); if(bad.length) throw new Error(`Unexpected files: ${bad.join(", ")}`); if(missing.length) throw new Error(`Missing files: ${missing.join(", ")}`); fs.appendFileSync(process.env.GITHUB_OUTPUT, `filename=${p.filename}\n`); console.error(`${p.filename}: ${p.entryCount} files, ${p.size} bytes`);'
      - name: Install and execute the packed artifact
        env:
          PACKAGE_FILE: ${{ steps.package.outputs.filename }}
        run: |
          smoke_dir=$(mktemp -d)
          npm install --prefix "$smoke_dir" "./$PACKAGE_FILE" >/dev/null
          set +e
          "$smoke_dir/node_modules/.bin/excalidash-mcp" >"$smoke_dir/stdout" 2>"$smoke_dir/stderr"
          status=$?
          set -e
          test "$status" -eq 1
          test ! -s "$smoke_dir/stdout"
          grep -q "Missing ExcaliDash credentials" "$smoke_dir/stderr"
          CODEX_HOME="$smoke_dir/codex" "$smoke_dir/node_modules/.bin/excalidash-mcp" install-skill --client codex
          test -f "$smoke_dir/codex/skills/excalidash-diagramming/SKILL.md"
          CLAUDE_CONFIG_DIR="$smoke_dir/claude" "$smoke_dir/node_modules/.bin/excalidash-mcp" install-skill --client claude
          test -f "$smoke_dir/claude/skills/excalidash-diagramming/SKILL.md"
      - uses: actions/upload-artifact@v6
        with:
          name: npm-package
          path: "excalidash-mcp-*.tgz"

  publish:
    name: Publish with provenance
    needs: pack
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    environment: npm
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/download-artifact@v6
        with:
          name: npm-package
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - run: npm publish excalidash-mcp-*.tgz --access public --provenance
        # NPM_TOKEN bootstraps the first release. Once npm Trusted Publishing is
        # configured for this workflow, delete the secret and revoke the token;
        # npm 11+ will authenticate through the job's OIDC identity instead.
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
